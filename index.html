class SoundManager {
  private enabled: boolean = true;
  private audioPool: HTMLAudioElement[] = [];
  private poolIndex: number = 0;

  constructor() {
    if (typeof window !== 'undefined') {
      for (let i = 0; i < 4; i++) {
        const audio = new Audio(encodeURI(ASSETS.sounds.pop));
        audio.preload = 'auto';
        audio.volume = 0.6;
        this.audioPool.push(audio);
      }
    }
  }

  public isEnabled(): boolean {
    return this.enabled;
  }

  public setEnabled(val: boolean): void {
    this.enabled = val;
  }

  public toggle(): boolean {
    this.enabled = !this.enabled;
    if (this.enabled) {
      this.playPop();
    }
    return this.enabled;
  }

  public playPop(): void {
    if (!this.enabled || typeof window === 'undefined') return;

    try {
      const audio = this.audioPool[this.poolIndex] || new Audio(encodeURI(ASSETS.sounds.pop));
      this.poolIndex = (this.poolIndex + 1) % Math.max(1, this.audioPool.length);
      audio.currentTime = 0;
      audio.volume = 0.6;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Ignore autoplay restriction errors on initial un-interacted render
        });
      }
    } catch {
      // Ignore audio errors
    }
  }
}
const soundManager = new SoundManager();

interface LightboxModalProps {
  isOpen: boolean;
  items: DemoScreenshot[];

  onClose: () => void;
  onSelectIndex: (index: number) => void;
}
const LightboxModal: React.FC<LightboxModalProps> = ({
  isOpen,
  items,
  currentIndex,
  onClose,
  onSelectIndex,
}) => {
  const [zoom, setZoom] = useState<number>(1);

  useEffect(() => {
    setZoom(1);
  }, [currentIndex, isOpen]);

  useEffect(() => {
    if (!isOpen) return;
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key === 'Escape') {
        soundManager.playPop();
        onClose();
      } else if (e.key === 'ArrowRight' && items.length > 1) {
        e.stopPropagation();
        soundManager.playPop();
        onSelectIndex((currentIndex + 1) % items.length);
      } else if (e.key === 'ArrowLeft' && items.length > 1) {
        e.stopPropagation();
        soundManager.playPop();
        onSelectIndex((currentIndex - 1 + items.length) % items.length);
      }
    };
    window.addEventListener('keydown', handleKeyDown, true);
    return () => window.removeEventListener('keydown', handleKeyDown, true);
  }, [isOpen, currentIndex, items.length, onClose, onSelectIndex]);

  if (!isOpen || items.length === 0) return null;

  const activeItem = items[currentIndex] || items[0];

  const handleZoomIn = () => {
    soundManager.playPop();
    setZoom((z) => Math.min(3, +(z + 0.5).toFixed(2)));
  };

  const handleZoomOut = () => {
    soundManager.playPop();
    setZoom((z) => Math.max(1, +(z - 0.5).toFixed(2)));
  };

  const handleResetZoom = () => {
    soundManager.playPop();
    setZoom(1);
  };

  const handleToggleImageZoom = () => {
    soundManager.playPop();
    setZoom((z) => (z === 1 ? 1.85 : 1));
  };

  return (
    <AnimatePresence>
      {isOpen && (
        <motion.div
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}

                  <ZoomOut className="w-4 h-4" />
                </button>

interface CountUpNumberProps {
  target: number;
  prefix?: string;
  suffix?: string;
  durationMs?: number;
}

const CountUpNumber: React.FC<CountUpNumberProps> = ({
  target,
  prefix = '',
  suffix = '',
  durationMs = 1200,
}) => {
  const [count, setCount] = useState(0);

  useEffect(() => {
    let startTime: number | null = null;
    let rafId: number;

    const step = (timestamp: number) => {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = Math.min(elapsed / durationMs, 1);
      const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      setCount(Math.round(eased * target));
      if (progress < 1) {
        rafId = requestAnimationFrame(step);
      }
    };

    rafId = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafId);
  }, [target, durationMs]);

  return (
    <span className="tabular-nums">
      {prefix}
      {count}
      {suffix}
    </span>
  );
};
const StatsSlide: React.FC = () => {
  const { stats } = WRAPPED_DATA;
  const [activeCardId, setActiveCardId] = useState<string>('cases');
  const [activePointIdx, setActivePointIdx] = useState<number>(2); // Default highlight on 06/11 (peak: 24)

  const iconsMap: Record<string, React.ElementType> = {
    sessions: Flame,
    speakers: Users,
    cases: Briefcase,
    evolution: Sparkles,
  };

  // SVG Chart Geometry for Attendance Evolution
  const chartPoints = stats.attendanceChart.points;
  const svgW = 540;
  const svgH = 140;
  const padX = 52;
  const padTop = 26;
  const padBot = 30;
  const minVal = 14;
  const maxVal = 26;

  const coords = chartPoints.map((pt, i) => {
    const x = padX + (i / (chartPoints.length - 1)) * (svgW - padX * 2);
    const y =
      padTop +
      (1 - (pt.attendees - minVal) / (maxVal - minVal)) * (svgH - padTop - padBot);
    return { ...pt, x, y };

interface GridPlotTwistSlideProps {
  onOpenLightbox: (items: DemoScreenshot[], index: number) => void;
}
const GridPlotTwistSlide: React.FC<GridPlotTwistSlideProps> = ({ onOpenLightbox }) => {
  const { grid2027 } = WRAPPED_DATA;
  const [tilt, setTilt] = useState<{ rotateX: number; rotateY: number; glareX: number; glareY: number }>({
    rotateX: 0,
    rotateY: 0,
    glareX: 50,
    glareY: 50,
  });
  const [activeEvolutionId, setActiveEvolutionId] = useState<string>('three-new-skills');

  const handleMouseMove = (e: React.MouseEvent<HTMLDivElement>) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = ((y - centerY) / centerY) * -10;
    const rotateY = ((x - centerX) / centerX) * 10;
    const glareX = (x / rect.width) * 100;
    const glareY = (y / rect.height) * 100;
    setTilt({ rotateX, rotateY, glareX, glareY });
  };

  const handleMouseLeave = () => {
    setTilt({ rotateX: 0, rotateY: 0, glareX: 50, glareY: 50 });
  };

  const iconsMap: Record<string, React.ElementType> = {
    BrainCircuit,
    Compass,
    Rocket,
    ShieldCheck,
  };

  return (
    <div className="w-full h-full flex flex-col justify-center px-3 sm:px-8 py-2 overflow-y-auto">
      <div className="max-w-7xl w-full mx-auto">
        {/* Header */}
        <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-2 mb-3">
          <div>
            <span className="inline-flex items-center gap-1.5 text-[11px] font-extrabold tracking-[0.2em] uppercase text-[#E6007E]">
              <Sparkles className="w-3.5 h-3.5" />
              {grid2027.eyebrow}
            </span>
            <h2 className="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">
              {grid2027.title}
            </h2>
          </div>
          <p className="text-xs text-white/75 max-w-lg">
            {grid2027.subtitle}
          </p>
        </div>

        {/* Main Grid Layout: Protagonist 3D Tilt Illustration (Left 5 cols) + Comparative Evolutions (Right 7 cols) */}
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
          {/* Left: Interactive 3D Tilt Hero Card */}
          <motion.div
            initial={{ opacity: 0, scale: 0.92 }}
            animate={{ opacity: 1, scale: 1 }}
            transition={{ duration: 0.5 }}
            className="lg:col-span-5 flex flex-col justify-between"
            style={{ perspective: '1100px' }}
          >
            <div
              onMouseMove={handleMouseMove}
              onMouseLeave={handleMouseLeave}
              onClick={() => {
                soundManager.playPop();
                onOpenLightbox(
                  [
                    {
                      id: 'camilo-joaquin-grid',
                      title: 'Consulting Grid 2027 & El Bono · Camilo y Joaquín Ruíz',
                      subtitle: grid2027.heroCaption,
                      src: grid2027.heroImage,
                      badge: 'Ilustración Oficial · 60 Puntos & Bono',
                    },
                  ],
                  0
                );
              }}
              style={{
                transform: `rotateX(${tilt.rotateX}deg) rotateY(${tilt.rotateY}deg)`,
                transition:
                  tilt.rotateX === 0 && tilt.rotateY === 0
                    ? 'transform 0.45s ease-out'
                    : 'transform 0.08s ease-out',
                transformStyle: 'preserve-3d',
              }}
              className="group relative h-full rounded-3xl p-1 bg-gradient-to-tr from-[#E6007E] via-[#8B5CF6] to-[#3B82F6] shadow-[0_0_45px_rgba(230,0,126,0.45)] cursor-pointer select-none"

interface OutroAuraSlideProps {
  onRestart: () => void;
}
const OutroAuraSlide: React.FC<OutroAuraSlideProps> = ({ onRestart }) => {
  const { outro } = WRAPPED_DATA;
  const [isDownloading, setIsDownloading] = useState<boolean>(false);
  const [downloadedSuccess, setDownloadedSuccess] = useState<boolean>(false);

  const triggerCelebration = useCallback(() => {
    soundManager.playPop();
    try {
      const colors = ['#E6007E', '#8B5CF6', '#3B82F6', '#FFFFFF', '#10B981'];
      confetti({
        particleCount: 80,
        spread: 75,
        origin: { y: 0.6 },
        colors,
      });
      setTimeout(() => {
        confetti({
          particleCount: 55,
          angle: 60,
          spread: 60,
          origin: { x: 0.1, y: 0.65 },
          colors,
        });
        confetti({
          particleCount: 55,
          angle: 120,
          spread: 60,
          origin: { x: 0.9, y: 0.65 },
          colors,
        });
      }, 220);
    } catch {
      // Ignore confetti errors
    }
  }, []);

  useEffect(() => {
    triggerCelebration();
  }, [triggerCelebration]);

  const handleDownloadInfographicImage = async () => {
    soundManager.playPop();
    setIsDownloading(true);
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 1400;
      canvas.height = 860;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      // 1. Deep Navy Background
      ctx.fillStyle = '#051336';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Radial Glows
      const grad1 = ctx.createRadialGradient(260, 180, 20, 260, 180, 560);
      grad1.addColorStop(0, 'rgba(230, 0, 126, 0.5)');
      grad1.addColorStop(0.5, 'rgba(139, 92, 246, 0.25)');
      grad1.addColorStop(1, 'rgba(5, 19, 54, 0)');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const grad2 = ctx.createRadialGradient(1150, 680, 20, 1150, 680, 580);
      grad2.addColorStop(0, 'rgba(59, 130, 246, 0.45)');
      grad2.addColorStop(1, 'rgba(5, 19, 54, 0)');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. Outer Neon Border
      const borderGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      borderGrad.addColorStop(0, '#E6007E');
      borderGrad.addColorStop(0.5, '#8B5CF6');
      borderGrad.addColorStop(1, '#3B82F6');
      ctx.strokeStyle = borderGrad;
      ctx.lineWidth = 6;
      ctx.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);

      // 4. Logo ARTEFACT
      await new Promise<void>((resolve) => {
        const logoImg = new Image();
        logoImg.crossOrigin = 'anonymous';
        logoImg.onload = () => {
          const targetH = 36;
          const targetW = (logoImg.width / logoImg.height) * targetH;
          ctx.drawImage(logoImg, 70, 68, targetW, targetH);
          resolve();
        };
        logoImg.onerror = () => resolve();
        logoImg.src = encodeURI(outro.logo);
      });

      // 5. Title & Subtitle
      ctx.fillStyle = '#E6007E';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText('INFOGRAFÍA OFICIAL · CONSULTING WRAPPED 2026–2027', 70, 138);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 40px sans-serif';
      ctx.fillText('Nuevo Consulting Grid 2027: Cambios y Aprendizajes', 70, 186);

      // 6. Big Metrics Row (13->15 Skills, 6->7 Categorías, 52->60 Puntos)
      outro.bigMetrics.forEach((m, i) => {
        const x = 70 + i * 425;
        const y = 215;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillRect(x, y, 400, 125);
        ctx.strokeStyle = 'rgba(230, 0, 126, 0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 400, 125);

        ctx.fillStyle = '#E6007E';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`${m.label.toUpperCase()} (${m.delta})`, x + 20, y + 34);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 38px sans-serif';
        ctx.fillText(`${m.from} → ${m.to}`, x + 20, y + 82);

        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '500 14px sans-serif';
        ctx.fillText(m.detail, x + 20, y + 108);
      });

const AUTO_ADVANCE_MS = 18000;
const App: React.FC = () => {
  const totalSlides = WRAPPED_DATA.slides.length;
  const [currentSlide, setCurrentSlide] = useState<number>(0);
  const [direction, setDirection] = useState<number>(1);
  const [isPlaying, setIsPlaying] = useState<boolean>(false);
  const [progress, setProgress] = useState<number>(100);
  const [soundEnabled, setSoundEnabled] = useState<boolean>(true);
  const [isFullscreen, setIsFullscreen] = useState<boolean>(false);

  // Lightbox state
  const [lightboxOpen, setLightboxOpen] = useState<boolean>(false);
  const [lightboxItems, setLightboxItems] = useState<DemoScreenshot[]>([]);
  const [lightboxIndex, setLightboxIndex] = useState<number>(0);

  const goToSlide = useCallback(
    (targetIdx: number) => {
      if (targetIdx < 0 || targetIdx >= totalSlides || targetIdx === currentSlide) return;
      soundManager.playPop();
      setDirection(targetIdx > currentSlide ? 1 : -1);
      setCurrentSlide(targetIdx);
      setProgress(isPlaying ? 0 : 100);
    },
    [currentSlide, totalSlides, isPlaying]
  );

  const handleNext = useCallback(() => {
    if (currentSlide < totalSlides - 1) {
      soundManager.playPop();
      setDirection(1);
      setCurrentSlide((s) => s + 1);
      setProgress(isPlaying ? 0 : 100);
    } else {
      setIsPlaying(false);
      setProgress(100);
    }
  }, [currentSlide, totalSlides, isPlaying]);

  const handlePrev = useCallback(() => {
    if (currentSlide > 0) {
      soundManager.playPop();
      setDirection(-1);
      setCurrentSlide((s) => s - 1);
      setProgress(isPlaying ? 0 : 100);
    }
  }, [currentSlide, isPlaying]);

  const handleTogglePlay = useCallback(() => {
    soundManager.playPop();
    setIsPlaying((prev) => {
      const next = !prev;
      setProgress(next ? 0 : 100);
      return next;
    });
  }, []);

  const handleToggleSound = useCallback(() => {
    const nextState = soundManager.toggle();
    setSoundEnabled(nextState);
  }, []);

  const handleToggleFullscreen = useCallback(() => {
    soundManager.playPop();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }, []);

  useEffect(() => {
    const onFullscreenChange = () => {
      setIsFullscreen(Boolean(document.fullscreenElement));
    };
    document.addEventListener('fullscreenchange', onFullscreenChange);
    return () => document.removeEventListener('fullscreenchange', onFullscreenChange);
  }, []);

  // Auto-advance timer when isPlaying is true and lightbox is closed
  useEffect(() => {
    if (!isPlaying || lightboxOpen) return;

    const intervalMs = 100;
    const step = (intervalMs / AUTO_ADVANCE_MS) * 100;

    const timer = setInterval(() => {
      setProgress((prev) => {
        if (prev + step >= 100) {
          handleNext();
          return 0;
        }
        return prev + step;
      });
    }, intervalMs);

    return () => clearInterval(timer);
  }, [isPlaying, lightboxOpen, handleNext]);

  // Global keyboard navigation
  useEffect(() => {
    const onKeyDown = (e: KeyboardEvent) => {
      if (lightboxOpen) return;
      if (e.key === 'ArrowRight') {
        handleNext();
      } else if (e.key === 'ArrowLeft') {
        handlePrev();
      } else if (e.key === ' ') {
        e.preventDefault();
        handleTogglePlay();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [lightboxOpen, handleNext, handlePrev, handleTogglePlay]);

  const handleOpenLightbox = (items: DemoScreenshot[], index: number) => {
    setIsPlaying(false);
    setProgress(100);
    setLightboxItems(items);
    setLightboxIndex(index);
    setLightboxOpen(true);
  };

  return (
    <div className="relative w-screen h-screen overflow-hidden bg-[#051336] text-white flex flex-col justify-between select-none">
      {/* Animated Geometric Artefact Background */}
      <ArtefactBackground slideIndex={currentSlide} />

      {/* Top Stories Navigation & Floating Sound / Fullscreen Controls */}
      <StoriesHeader
        currentSlide={currentSlide}
        totalSlides={totalSlides}
        progress={progress}
        isPlaying={isPlaying}
        soundEnabled={soundEnabled}
        isFullscreen={isFullscreen}
        onSelectSlide={goToSlide}
        onPrev={handlePrev}
        onNext={handleNext}
        onTogglePlay={handleTogglePlay}
        onToggleSound={handleToggleSound}
        onToggleFullscreen={handleToggleFullscreen}
      />

      {/* Left / Right Edge Click Zones for Stories Navigation */}
      {currentSlide > 0 && (
        <button
          onClick={handlePrev}
          aria-label="Slide anterior"
          title="Slide anterior (←)"
          className="hidden xl:flex fixed left-2 top-1/2 -translate-y-1/2 z-30 w-10 h-28 rounded-2xl items-center justify-center bg-white/[0.03] hover:bg-white/[0.12] border border-transparent hover:border-white/20 text-white/30 hover:text-white transition-all cursor-pointer"
        >
          <ChevronLeft className="w-6 h-6" />
        </button>
      )}

      {currentSlide < totalSlides - 1 && (
        <button
          onClick={handleNext}
          aria-label="Siguiente slide"
          title="Siguiente slide (→)"
          className="hidden xl:flex fixed right-2 top-1/2 -translate-y-1/2 z-30 w-10 h-28 rounded-2xl items-center justify-center bg-white/[0.03] hover:bg-white/[0.12] border border-transparent hover:border-white/20 text-white/30 hover:text-white transition-all cursor-pointer"
        >
          <ChevronRight className="w-6 h-6" />
        </button>
      )}

      {/* Main Slide Stage */}
      <main className="relative z-20 flex-1 w-full overflow-y-auto overflow-x-hidden flex items-center justify-center">
        <AnimatePresence mode="wait" custom={direction}>
          <motion.div
            key={currentSlide}
            custom={direction}
            initial={{ opacity: 0, x: direction > 0 ? 45 : -45, scale: 0.98 }}
            animate={{ opacity: 1, x: 0, scale: 1 }}
            exit={{ opacity: 0, x: direction > 0 ? -45 : 45, scale: 0.98 }}
            transition={{ duration: 0.32, ease: 'easeOut' }}
            className="w-full h-full flex items-center justify-center"
          >
            {currentSlide === 0 && (
              <IntroSlide
                onStart={() => goToSlide(1)}
                onJumpToSlide={(idx) => goToSlide(idx)}
              />
            )}
            {currentSlide === 1 && <StatsSlide />}
            {currentSlide === 2 && <SpeakersSlide />}
            {currentSlide === 3 && (
              <TimelineSlide
                onOpenLightbox={handleOpenLightbox}
                onJumpToSlide={(idx) => goToSlide(idx)}
              />
            )}
            {currentSlide === 4 && (
              <GridPlotTwistSlide onOpenLightbox={handleOpenLightbox} />
            )}
            {currentSlide === 5 && <PlaylistSlide />}
            {currentSlide === 6 && (
              <OutroAuraSlide onRestart={() => goToSlide(0)} />
            )}
          </motion.div>
        </AnimatePresence>
      </main>

      {/* Bottom Subtle Navigation Bar */}
      <footer className="relative z-30 px-4 sm:px-8 py-2 flex items-center justify-between text-[11px] text-white/50 border-t border-white/10 bg-[#051336]/60 backdrop-blur-md">
        <div className="flex items-center gap-2">
          <span className="font-bold text-white/80">
            Artefact LATAM · Chapter de Consulting
          </span>
          <span className="hidden sm:inline">•</span>
          <span className="hidden sm:inline">
            Usa las flechas ⬅️ ➡️ del teclado o las barras superiores para navegar
          </span>
        </div>

        <div className="flex items-center gap-3">
          <button
            onClick={handlePrev}
            disabled={currentSlide === 0}
            className="hover:text-white disabled:opacity-30 transition cursor-pointer font-semibold"
          >
            ← Anterior
          </button>
          <span className="text-white/30">|</span>
          <button
            onClick={handleNext}
            disabled={currentSlide === totalSlides - 1}
            className="hover:text-[#E6007E] disabled:opacity-30 transition cursor-pointer font-bold text-white/85"
          >
            Siguiente →
          </button>
        </div>
      </footer>

      {/* Lightbox Modal for Demos (catman.png, agente catman.png, ARTETALK (PALACIOS).png, etc.) */}
      <LightboxModal
        isOpen={lightboxOpen}
        items={lightboxItems}
        currentIndex={lightboxIndex}
        onClose={() => setLightboxOpen(false)}
        onSelectIndex={(idx) => setLightboxIndex(idx)}
      />
    </div>
  );
};
